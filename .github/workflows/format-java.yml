name: Format Java code

on:
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v2

      - name: Create new branch
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout -b format-java-${{ github.run_number }}

      - name: Install formatter
        run: npm install prettier prettier-plugin-java

      - name: Format Java
        run: npx prettier --write "src/**/*.java"

      - name: Push changes
        run: |
          git add .
          git commit -m "Format Java code"
          git push origin format-java-${{ github.run_number }}

      - name: Create pull request
        run: |
          curl --request POST \
          --url https://api.github.com/repos/${{ github.repository }}/pulls \
          --header 'Accept: application/vnd.github.v3+json' \
          --header 'Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' \
          --header 'Content-Type: application/json' \
          --data '{ "title": "Format Java code", "head": "format-java-${{ github.run_number }}", "base": "master" }' \
          --fail
